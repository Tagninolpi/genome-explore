<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Genome viewer</title>
<style>
  :root {
    --bg:#fff; --fg:#1c1f23; --muted:#6b7280; --line:#e3e5e8; --head:#f3f4f6; --accent:#2457d6;
    --ncbi:#1f7a4d; --gwh:#b4531a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171a; --fg:#e6e8ea; --muted:#9aa1a9; --line:#2a2f35; --head:#1d2126; --accent:#7ea2ff;
            --ncbi:#5fcf9a; --gwh:#f0a06a; }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { display:flex; flex-direction:column; background:var(--bg); color:var(--fg);
         font:14px/1.4 system-ui, sans-serif; padding:12px 16px; gap:10px; }
  .bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  input, button { font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line);
                  border-radius:6px; padding:6px 10px; }
  button { cursor:pointer; }
  button:hover:not(:disabled) { border-color:var(--accent); }
  button:disabled { opacity:.4; cursor:default; }
  button.on { border-color:var(--accent); color:var(--accent); }
  #status { color:var(--muted); margin-left:auto; }

  #wrap { flex:1; min-height:0; overflow-x:auto; overflow-y:hidden; border:1px solid var(--line); border-radius:6px; }
  table { border-collapse:separate; border-spacing:0; white-space:nowrap; }
  th, td { height:30px; padding:0 12px; border-bottom:1px solid var(--line); text-align:left; }
  th { height:44px; background:var(--head); position:sticky; top:0; cursor:pointer; user-select:none; z-index:2; }
  th:hover { color:var(--accent); }
  th small { display:block; font-size:11px; color:var(--muted); font-weight:400; }
  th:first-child, td:first-child { position:sticky; left:0; background:var(--bg); z-index:1;
                                   border-right:1px solid var(--line); }
  th:first-child { background:var(--head); z-index:3; }
  .tag { font-size:11px; font-weight:600; margin-right:4px; }
  .tag.ncbi { color:var(--ncbi); } .tag.gwh { color:var(--gwh); }
  .sep { color:var(--muted); margin:0 6px; }
  .nil { color:var(--muted); }

  .pager { display:flex; gap:8px; align-items:center; justify-content:center; }
</style>
</head>
<body>
  <div class="bar">
    <input id="taxid" placeholder="taxid, e.g. 9823" size="14">
    <button id="go">Fetch</button>
    <span style="width:16px"></span>
    <span class="nil">All columns:</span>
    <button data-mode="both">both</button>
    <button data-mode="ncbi">NCBI</button>
    <button data-mode="gwh">GWH</button>
    <span id="status"></span>
  </div>

  <div id="wrap"><table id="table"></table></div>

  <div class="pager">
    <button id="prev">Previous</button>
    <span id="pageinfo"></span>
    <button id="next">Next</button>
  </div>

  <script src="/app.js"></script>
</body>
</html>
